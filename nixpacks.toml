# WJ-ARGUS needs BOTH runtimes: Python (FastAPI/uvicorn) serves the app,
# Node (snarkjs) runs as a subprocess for Groth16 proving.
# NOTE: only the python provider is listed — the "node" provider pulls
# nodejs_18 + corepack, which conflicts with the nodejs_20 nix package
# below (build failed on duplicate corepack files, 2026-11-19). Node 20
# (with its bundled npm) comes from nixPkgs instead: exactly one Node.
providers = ["python"]

[phases.setup]
# python311Packages.pip is required explicitly: overriding nixPkgs drops
# the python provider's default pip, and the bare nix python311 has no
# pip module (build failed "No module named pip", 2026-11-19).
nixPkgs = ["python311", "python311Packages.pip", "nodejs_20"]

# Root requirements.txt mirrors agent/requirements.txt so the python
# provider installs the app deps; the prover's npm deps are installed
# into agent/prover/node_modules (present at runtime for prove.js).
[phases.install]
cmds = [
  "python -m pip install -r requirements.txt",
  "npm --prefix agent/prover ci"
]

[start]
cmd = "cd agent && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
